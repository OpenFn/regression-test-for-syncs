on:
  push:
    branches:
      - main

concurrency:
  group: openfn-deployment
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: A job to deploy to Lightning
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: openfn/cli-deploy-action@v1.0.0
        with:
          secret_input: ${{ secrets.OPENFN_047331db_ee69_4a2b_be14_7f4ed821dc75_API_KEY }}
          config_path_input: 'openfn-047331db-ee69-4a2b-be14-7f4ed821dc75-config.json'
